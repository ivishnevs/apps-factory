services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: factory
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Byte-order text comparison, as Core's ORDER BY ... id expects on every host.
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  nats:
    image: nats:2.11.4-alpine
    command: ["-js", "-sd", "/data", "--user", "factory", "--pass", "${NATS_PASSWORD:?set NATS_PASSWORD in .env}"]
    ports:
      - "127.0.0.1:4222:4222"
    volumes:
      - nats-data:/data
    restart: unless-stopped
  core:
    build: .
    environment:
      FACTORY_LISTEN: 0.0.0.0:8080
      FACTORY_DATABASE_URL: postgres://factory:${POSTGRES_PASSWORD}@postgres:5432/factory?sslmode=disable
      FACTORY_DATA_DIR: /data
      FACTORY_COMPANY: ${FACTORY_COMPANY:-default}
      FACTORY_WORKSPACE_HOST_ROOT: ${FACTORY_WORKSPACE_HOST_ROOT:-${PWD}}
      FACTORY_WORKSPACE_LOCAL_ROOT: /workspaces
      FACTORY_TOKEN: ${FACTORY_TOKEN:?set FACTORY_TOKEN in .env}
      NATS_URL: nats://factory:${NATS_PASSWORD}@nats:4222
      # Runs end with factory_exit_* (docs/explicit-exits-contract.md); set 0 in .env for the old rules.
      FACTORY_EXPLICIT_EXITS: ${FACTORY_EXPLICIT_EXITS:-1}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - core-data:/data
      - type: bind
        source: ${FACTORY_WORKSPACE_HOST_ROOT:-${PWD}}
        target: /workspaces
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped
volumes:
  postgres-data:
  nats-data:
  core-data:
