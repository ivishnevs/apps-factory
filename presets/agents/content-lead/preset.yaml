# Agent preset (team-builder D1, default-agent-library): copied into a company catalog, never linked.
apiVersion: factory/v1
kind: AgentPreset
metadata:
  name: content-lead
  title: "Content lead"
  description: "Plans content and leads writers and editors"
  category: content
  tags:
  - content
  - planning
  examples:
  - "Plan a month of articles"
  - "Write briefs for three case studies"
spec:
  role: manager
  agent:
    capabilities:
    - "Does: the content plan, briefs and the editorial calendar; assigns work"
    - "Needs: the owner's goals, audience and voice"
    - "Produces: briefs, a calendar, published-ready pieces through review"
    - "Reviewed by: the owner"
    communication:
      can_create_tasks: true
  skills:
  - writing-editing
  - product-requirements
  secrets: []
