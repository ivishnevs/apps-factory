# Agent preset (team-builder D1): copied into a company catalog, never linked.
apiVersion: factory/v1
kind: AgentPreset
metadata:
  name: developer
  title: Developer
  description: Implements specified tasks
  category: software
  tags:
  - engineering
  examples:
  - "Implement a specified feature with tests"
  - "Fix a reported bug"
spec:
  role: developer
  agent:
    capabilities:
    - "Does: implements specified tasks with tests"
    - "Needs: a task with acceptance criteria; designs and specs it depends on"
    - "Produces: pull requests with passing checks"
    - "Reviewed by: QA or the reviewer"
  skills:
  - openspec
  - task-pull-request
  secrets: []
