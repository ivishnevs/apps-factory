# Agent preset (team-builder D1): copied into a company catalog, never linked.
apiVersion: factory/v1
kind: AgentPreset
metadata:
  name: qa
  title: QA
  description: Verifies delivered behaviour
  category: software
  tags:
  - quality
  - review
  examples:
  - "Verify a feature against its criteria"
  - "Report defects with steps"
spec:
  role: qa
  agent:
    capabilities:
    - "Does: verifies delivered behaviour and reviews developers' pull requests"
    - "Needs: submitted work with its task and acceptance criteria"
    - "Produces: review verdicts, defect reports with steps and evidence"
    - "Reviewed by: the lead"
  skills:
  - openspec
  - mobile-app-testing
  secrets: []
