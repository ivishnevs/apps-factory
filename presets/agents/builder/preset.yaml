# Agent preset (team-builder D1): copied into a company catalog, never linked.
apiVersion: factory/v1
kind: AgentPreset
metadata:
  name: builder
  title: Builder
  description: Plans, builds and ships the product alone
  category: software
  tags:
  - solo
  - engineering
  - planning
  examples:
  - "Build and ship a small web app end to end"
  - "Fix a bug and release"
spec:
  role: developer
  agent:
    capabilities:
    - "Does: plans, builds, tests and ships the whole product alone"
    - "Needs: the owner's goal and direction"
    - "Produces: merged pull requests, release builds, reports"
    - "Reviewed by: the owner"
    communication:
      can_create_tasks: true
      can_assign_tasks: true
  skills:
  - openspec
  - task-pull-request
  secrets: []
