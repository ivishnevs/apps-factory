# Agent preset (team-builder D1): copied into a company catalog, never linked.
apiVersion: factory/v1
kind: AgentPreset
metadata:
  name: product-owner
  title: Product owner
  description: Owns the requirements and the plan
  category: software
  tags:
  - product
  - planning
  examples:
  - "Write requirements for a feature"
  - "Plan the next milestone"
spec:
  role: manager
  agent:
    capabilities:
    - "Does: owns the requirements, the plan and the backlog; splits goals into tasks"
    - "Needs: the owner's goals and direction"
    - "Produces: specs, prioritised tasks with dependencies, progress reports"
    - "Reviewed by: the owner"
    communication:
      can_create_tasks: true
      can_assign_tasks: true
  skills:
  - openspec
  secrets: []
