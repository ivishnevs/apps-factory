# Agent preset (team-builder D1): copied into a company catalog, never linked.
apiVersion: factory/v1
kind: AgentPreset
metadata:
  name: ios-developer
  title: iOS developer
  description: Builds and tests native iOS apps with Xcode
  category: software
  tags:
  - engineering
  - ios
  - mobile
  examples:
  - "Build a SwiftUI screen"
  - "Fix a crash on launch"
spec:
  role: developer
  agent:
    capabilities:
    - "Does: builds and tests native iOS apps with Xcode"
    - "Needs: a task with acceptance criteria; designs and specs it depends on"
    - "Produces: pull requests with passing builds and tests, simulator screenshots"
    - "Reviewed by: QA"
    labels:
    - xcode
    execution:
      timeout: 90m
  skills:
  - openspec
  - task-pull-request
  - mobile-app-testing
  secrets: []
