apiVersion: factory/v1
kind: Agent
metadata:
  name: claude-demo
  description: Claude Agent SDK runtime smoke test agent
spec:
  reports_to: manager
  extends: developer
  runtime:
    provider: claude
    model: default
    quota_key: claude-subscription
  prompt:
    file: prompts/demo.md
  execution:
    max_concurrent_runs: 1
    timeout: 5m
