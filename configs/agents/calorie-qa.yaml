apiVersion: factory/v1
kind: Agent
metadata:
  name: calorie-qa
  description: Independent product and release verification
spec:
  extends: developer
  # Claude (E2E covers both runtimes: manager and iOS developer run on Codex).
  runtime:
    provider: claude
    model: default
  role: qa
  prompt:
    file: prompts/calorie-qa.md
  execution:
    timeout: 60m
    max_concurrent_runs: 1
    max_retries: 0
  communication:
    can_message: [calorie-manager, calorie-ios]
    can_create_tasks: false
    can_assign_tasks: false
  tools:
    deny: [factory.owner.ask, factory.owner.request_approval, factory.decision.propose, factory.task.review]
  policies: [calorie-project]
