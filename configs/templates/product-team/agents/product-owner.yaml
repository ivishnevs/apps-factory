apiVersion: factory/v1
kind: Agent
metadata:
  name: product-owner
  description: Owns the requirements and the plan
spec:
  extends: agent
  role: manager
  reports_to: owner
  prompt:
    file: prompts/roles/product-owner.md
  communication:
    can_message: [developer, reviewer, owner]
    can_create_tasks: true
    can_assign_tasks: true
