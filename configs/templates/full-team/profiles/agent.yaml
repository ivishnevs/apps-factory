apiVersion: factory/v1
kind: AgentProfile
metadata:
  name: agent
  description: Defaults of every agent of the team
spec:
  role: developer
  runtime:
    provider: codex
    model: default
    quota_key: codex-subscription
  tools:
    mode: denylist
  approvals:
    mode: selective
  execution:
    max_concurrent_runs: 1
    timeout: 30m
    max_retries: 0
  skills:
    include: [openspec, task-pull-request]
  communication:
    can_message: [owner]
  policies: [engineering]
