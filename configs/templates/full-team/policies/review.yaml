apiVersion: factory/v1
kind: Policy
metadata:
  name: review
spec:
  rules:
    - name: code-review
      type: review
      roles: [developer]
      required: true
      reviewer: qa
      instruction: Code changes are reviewed before they are merged; submit for review with factory_exit_submit and merge after an approved verdict.
    - name: requirements-review
      type: review
      roles: [developer]
      paths:
        - match: openspec/changes/*/proposal.md
          reviewer: product-owner
        - match: openspec/changes/*/specs/**
          reviewer: product-owner
        - match: openspec/specs/**
          reviewer: product-owner
      instruction: Requirement changes (an OpenSpec proposal or spec deltas) in your pull request need the product owner's approval as well; ask before changing requirements.
